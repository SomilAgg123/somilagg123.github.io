name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version browser assets
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text()
          for asset in ('app.js', 'reading.js', 'styles.css'):
              version = hashlib.sha256(Path('dist', asset).read_bytes()).hexdigest()[:12]
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          index.write_text(html)
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Wait for the uploaded website to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact_attempt in {1..12}; do
            artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$artifact_count" -eq 1 ]; then
              exit 0
            fi
            if [ "$artifact_count" -gt 1 ]; then
              echo "::error::More than one website artifact was found."
              exit 1
            fi
            sleep 5
          done
          echo "::error::The website artifact did not become available within 60 seconds."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
