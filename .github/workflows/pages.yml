name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version browser assets
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          index = Path('dist/index.html')
          html = index.read_text()
          for asset in ('app.js', 'reading.js', 'paper-motion.js', 'paper-layout.js', 'writing-ink.js', 'pocket-reactions.js', 'pocket-cards.js', 'styles.css'):
              version = hashlib.sha256(Path('dist', asset).read_bytes()).hexdigest()[:12]
              html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
          index.write_text(html)
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Finish the upload job before artifact discovery; retrying deployment then
  # reuses the same artifact instead of uploading a duplicate.
  # https://github.com/actions/deploy-pages/issues/451
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
